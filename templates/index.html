<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#9d2235">
  <title>Tournament Translator</title>
  <style>
    :root {
      --cardinal:       #9d2235;
      --cardinal-dark:  #6e1825;
      --cardinal-deeper:#4a0f18;
      --gold:           #ffd700;
      --gold-dark:      #cc9200;
      --white:          #ffffff;
      --off-white:      #f9f9f9;
      --dark:           #262628;
      --muted:          #6b6b6b;
      --border:         #e0e0e0;
      --win-bg:         #e8f5ec;
      --win-text:       #1a6b33;
      --loss-bg:        #fdeaea;
      --loss-text:      #9d2235;
      --tie-bg:         #fff8e1;
      --tie-text:       #7a6000;
      --radius-sm:      6px;
      --radius:         12px;
      --radius-lg:      18px;
      --shadow:         0 2px 16px rgba(0,0,0,0.10);
      --shadow-sm:      0 1px 4px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: var(--off-white);
      color: var(--dark);
      min-height: 100vh;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    /* ── Header ── */
    header {
      background: linear-gradient(160deg, var(--cardinal-dark) 0%, var(--cardinal) 100%);
      padding: 0 0 16px;
      padding-top: env(safe-area-inset-top);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 0;
    }
    header img {
      height: 64px;
      object-fit: contain;
    }
    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .header-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--white);
      letter-spacing: -0.3px;
      text-transform: uppercase;
    }
    .header-subtitle {
      font-size: 11px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 8px 16px 0;
      overflow-x: auto;
      white-space: nowrap;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .breadcrumb::-webkit-scrollbar { display: none; }
    .breadcrumb.visible { display: flex; }
    .crumb {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      padding: 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: color 0.15s;
    }
    .crumb:hover, .crumb:active { color: var(--gold); }
    .crumb.active { color: var(--gold); }
    .crumb-sep { color: rgba(255,255,255,0.3); font-size: 10px; margin: 0 2px; }

    /* ── Main ── */
    main { padding: 16px; max-width: 540px; margin: 0 auto; }

    /* ── Section labels ── */
    .section-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 2px 10px;
    }
    .section-label.accent { color: var(--cardinal); }

    /* ── List cards ── */
    .card-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 24px; }

    .list-card {
      background: var(--white);
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.12s;
      border-bottom: 1px solid var(--border);
    }
    .card-list .list-card:first-child { border-radius: var(--radius) var(--radius) 0 0; }
    .card-list .list-card:last-child  { border-radius: 0 0 var(--radius) var(--radius); border-bottom: none; }
    .card-list .list-card:only-child  { border-radius: var(--radius); border-bottom: none; }
    .list-card:active { background: #f3f3f3; }

    .list-card-main { font-size: 16px; font-weight: 600; color: var(--dark); }
    .list-card-sub  { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .list-card-right { display: flex; align-items: center; gap: 8px; }
    .list-arrow { font-size: 20px; color: var(--cardinal); font-weight: 300; flex-shrink: 0; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .badge-past    { background: #f0f0f0; color: var(--muted); }
    .badge-upload  { background: var(--gold); color: var(--dark); }
    .badge-live    { background: var(--cardinal); color: var(--white); }

    /* ── Tournament section dividers ── */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 10px;
    }
    .section-divider-line { flex: 1; height: 1px; background: var(--border); }
    .section-divider-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Game cards ── */
    .games-group { margin-bottom: 20px; }
    .games-group-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--cardinal);
      margin-bottom: 10px;
      padding-left: 2px;
    }

    .game-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    .game-card-header {
      padding: 11px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }
    .game-card-meta { flex: 1; }
    .game-card-datetime {
      font-size: 13px;
      font-weight: 700;
      color: var(--dark);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .game-card-location {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .result-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }
    .result-pill.win  { background: var(--win-bg);  color: var(--win-text); }
    .result-pill.loss { background: var(--loss-bg); color: var(--loss-text); }
    .result-pill.tie  { background: var(--tie-bg);  color: var(--tie-text); }

    .game-card-body { padding: 12px 14px; }

    .game-opponent {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }
    .vs { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; flex-shrink: 0; }
    .opponent-name { font-size: 17px; font-weight: 700; color: var(--dark); line-height: 1.2; }

    .game-score {
      font-size: 26px;
      font-weight: 900;
      color: var(--dark);
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .tag {
      font-size: 12px;
      background: var(--off-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      color: var(--muted);
      font-weight: 500;
    }
    .tag strong { color: var(--dark); }

    /* ── Confidence banner ── */
    .conf-banner {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      margin-top: 10px;
      font-size: 13px;
    }
    .conf-banner.green  { background: var(--win-bg);  color: var(--win-text); }
    .conf-banner.yellow { background: var(--tie-bg);  color: #6b5000; }
    .conf-banner.red    { background: var(--loss-bg); color: var(--loss-text); }
    .conf-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .conf-text { line-height: 1.4; }
    .conf-upload-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--cardinal);
      text-decoration: underline;
      cursor: pointer;
    }

    /* ── Scenarios (what's next) ── */
    .scenarios-box {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .scenarios-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .scenario-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
    }
    .scenario-row.win-row  { background: var(--win-bg); }
    .scenario-row.lose-row { background: var(--loss-bg); }
    .scenario-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .scenario-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .scenario-opponent { font-size: 14px; font-weight: 700; color: var(--dark); margin: 2px 0; }
    .scenario-when { font-size: 12px; color: var(--muted); }

    /* ── Yes/No prompt ── */
    .yn-box {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .yn-question {
      font-size: 14px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 10px;
      line-height: 1.3;
    }
    .yn-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .yn-btn {
      padding: 12px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .yn-btn:active { transform: scale(0.97); }
    .yn-btn.yes { background: var(--cardinal); color: var(--white); }
    .yn-btn.no  { background: var(--dark);     color: var(--white); }

    /* ── Locked result ── */
    .locked-box {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .locked-result {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 10px;
    }
    .locked-icon { font-size: 18px; }
    .next-game-box {
      background: var(--off-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .next-game-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--cardinal);
      margin-bottom: 4px;
    }
    .next-game-opponent { font-size: 16px; font-weight: 700; }
    .next-game-meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .correct-link {
      font-size: 12px;
      color: var(--muted);
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
      margin-top: 4px;
    }

    /* ── Upload panel ── */
    .upload-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .upload-overlay.visible { display: flex; }
    .upload-sheet {
      background: var(--white);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
      width: 100%;
      max-width: 540px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .upload-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .upload-title {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.3px;
      margin-bottom: 16px;
    }

    .pw-input, .file-input-label {
      display: block;
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      font-family: inherit;
      outline: none;
      background: var(--white);
    }
    .pw-input:focus { border-color: var(--cardinal); }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 10px;
      transition: border-color 0.2s, background 0.2s;
      color: var(--muted);
      font-size: 14px;
    }
    .drop-zone.drag-over { border-color: var(--cardinal); background: #fff5f5; }
    .drop-zone .drop-icon { font-size: 28px; margin-bottom: 6px; }
    .drop-zone .drop-text { font-weight: 600; color: var(--dark); }
    .drop-zone .drop-sub { font-size: 12px; margin-top: 3px; }
    .drop-zone input[type=file] { display: none; }

    .upload-btn {
      width: 100%;
      padding: 14px;
      background: var(--cardinal);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }
    .upload-btn:active { background: var(--cardinal-dark); }
    .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cancel-btn {
      width: 100%;
      padding: 12px;
      background: none;
      color: var(--muted);
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      font-family: inherit;
    }
    .upload-msg {
      font-size: 13px;
      text-align: center;
      padding: 6px;
      border-radius: var(--radius-sm);
      margin-top: 8px;
    }
    .upload-msg.error   { background: var(--loss-bg); color: var(--loss-text); }
    .upload-msg.success { background: var(--win-bg);  color: var(--win-text); }

    /* ── Password modal ── */
    .pw-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .pw-overlay.visible { display: flex; }
    .pw-modal {
      background: var(--white);
      border-radius: var(--radius);
      padding: 24px 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: var(--shadow);
    }
    .pw-modal-title {
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .pw-modal-msg { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
    .pw-modal-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      font-family: inherit;
      outline: none;
    }
    .pw-modal-input:focus { border-color: var(--cardinal); }
    .pw-modal-btn {
      width: 100%;
      padding: 13px;
      background: var(--cardinal);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 8px;
    }
    .pw-modal-cancel {
      width: 100%;
      padding: 11px;
      background: none;
      color: var(--muted);
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .pw-error { font-size: 13px; color: var(--loss-text); margin-bottom: 8px; display: none; }

    /* ── Spinner ── */
    .spinner-wrap { display: flex; justify-content: center; padding: 48px 0; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--cardinal);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Gold accent bar under header ── */
    .gold-bar { height: 3px; background: var(--gold); }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="header-inner">
    <img src="/static/logo.png" alt="Tournament Translator">
    <div class="header-right">
      <div class="header-title">Tournament Translator</div>
    </div>
  </div>
  <div class="breadcrumb" id="breadcrumb">
    <span class="crumb" onclick="goHome()">Season</span>
    <span class="crumb-sep" id="sep1" style="display:none">›</span>
    <span class="crumb" id="crumb-tournament" onclick="goTournament()" style="display:none"></span>
    <span class="crumb-sep" id="sep2" style="display:none">›</span>
    <span class="crumb active" id="crumb-team" style="display:none"></span>
  </div>
</header>
<div class="gold-bar"></div>

<main>

  <!-- View: Tournament list -->
  <div id="view-tournaments" class="view active">
    <div id="tournament-list-content">
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- View: Team list -->
  <div id="view-teams" class="view">
    <div id="team-list-content"></div>
  </div>

  <!-- View: Games -->
  <div id="view-games" class="view">
    <div id="games-content"></div>
  </div>

</main>

<!-- Upload sheet -->
<div class="upload-overlay" id="upload-overlay" onclick="closeUpload(event)">
  <div class="upload-sheet" onclick="event.stopPropagation()">
    <div class="upload-handle"></div>
    <div class="upload-title">Upload Schedule</div>
    <input type="password" class="pw-input" id="upload-pw" placeholder="Password" autocomplete="current-password">
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" accept=".xlsx" onchange="handleFileSelect(this)">
      <div class="drop-icon">📂</div>
      <div class="drop-text" id="drop-text">Tap to select Excel file</div>
      <div class="drop-sub">.xlsx files only</div>
    </div>
    <button class="upload-btn" id="upload-btn" onclick="doUpload()" disabled>Upload Schedule</button>
    <button class="cancel-btn" onclick="closeUpload()">Cancel</button>
    <div class="upload-msg" id="upload-msg" style="display:none"></div>
  </div>
</div>

<!-- Password modal (for corrections) -->
<div class="pw-overlay" id="pw-overlay" onclick="closePwModal(event)">
  <div class="pw-modal" onclick="event.stopPropagation()">
    <div class="pw-modal-title">🔒 Confirm</div>
    <div class="pw-modal-msg" id="pw-modal-msg">Enter the admin password to make this change.</div>
    <div class="pw-error" id="pw-error">Incorrect password. Try again.</div>
    <input type="password" class="pw-modal-input" id="pw-modal-input" placeholder="Password"
           autocomplete="current-password" onkeydown="if(event.key==='Enter') submitPw()">
    <button class="pw-modal-btn" onclick="submitPw()">Confirm</button>
    <button class="pw-modal-cancel" onclick="closePwModal()">Cancel</button>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let state = { tournament: null, team: null, sheet: null };
let pendingFile = null;
let pwCallback  = null;

// ── Views ──────────────────────────────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function updateBreadcrumb() {
  const bc  = document.getElementById('breadcrumb');
  const sep1= document.getElementById('sep1');
  const sep2= document.getElementById('sep2');
  const ct  = document.getElementById('crumb-tournament');
  const cte = document.getElementById('crumb-team');
  const view= document.querySelector('.view.active').id;

  if (view === 'view-tournaments') { bc.classList.remove('visible'); return; }
  bc.classList.add('visible');

  if (view === 'view-teams') {
    sep1.style.display = 'inline';
    ct.style.display   = 'inline';
    ct.textContent     = state.tournament?.name || '';
    sep2.style.display = 'none';
    cte.style.display  = 'none';
  }
  if (view === 'view-games') {
    sep1.style.display = 'inline';
    ct.style.display   = 'inline';
    ct.textContent     = state.tournament?.name || '';
    sep2.style.display = 'inline';
    cte.style.display  = 'inline';
    cte.textContent    = state.team || '';
  }
}

function goHome()       { showView('view-tournaments'); updateBreadcrumb(); }
function goTournament() { showView('view-teams');       updateBreadcrumb(); }

// ── Tournaments ────────────────────────────────────────────────────────────────
async function loadTournaments() {
  const res  = await fetch('/api/tournaments');
  const list = await res.json();

  const upcoming = list.filter(t => !t.past);
  const past     = list.filter(t =>  t.past);

  const el = document.getElementById('tournament-list-content');
  el.innerHTML = '';

  if (upcoming.length) {
    el.appendChild(makeSectionLabel('Upcoming'));
    el.appendChild(makeTournamentCards(upcoming));
  }
  if (past.length) {
    if (upcoming.length) {
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.innerHTML = `<div class="section-divider-line"></div>
                       <div class="section-divider-label">Past</div>
                       <div class="section-divider-line"></div>`;
      el.appendChild(div);
    }
    el.appendChild(makeTournamentCards(past));
  }
}

function makeSectionLabel(text) {
  const p = document.createElement('p');
  p.className = 'section-label accent';
  p.textContent = text;
  return p;
}

function makeTournamentCards(tournaments) {
  const list = document.createElement('div');
  list.className = 'card-list';
  tournaments.forEach(t => {
    const card = document.createElement('div');
    card.className = 'list-card';

    let badgeHtml = '';
    if (!t.has_excel) {
      badgeHtml = `<span class="badge badge-upload">Upload Schedule</span>`;
    } else if (!t.past) {
      badgeHtml = `<span class="badge badge-live">Live</span>`;
    } else {
      badgeHtml = `<span class="badge badge-past">Done</span>`;
    }

    card.innerHTML = `
      <div>
        <div class="list-card-main">${t.name}</div>
        <div class="list-card-sub">${t.dates}</div>
      </div>
      <div class="list-card-right">
        ${badgeHtml}
        <span class="list-arrow">›</span>
      </div>`;

    card.onclick = () => {
      if (!t.has_excel) { openUpload(); return; }
      state.tournament = t;
      loadTeams(t);
    };
    list.appendChild(card);
  });
  return list;
}

// ── Teams ──────────────────────────────────────────────────────────────────────
async function loadTeams(tournament) {
  const el = document.getElementById('team-list-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  showView('view-teams');
  updateBreadcrumb();

  const res   = await fetch(`/api/trojan-teams/${encodeURIComponent(tournament.id)}`);
  const teams = await res.json();

  el.innerHTML = '';
  if (!teams.length) {
    el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--muted)">No Trojan teams found in this file.</div>`;
    return;
  }

  el.appendChild(makeSectionLabel('Select Your Team'));
  const list = document.createElement('div');
  list.className = 'card-list';
  teams.forEach(t => {
    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `<div class="list-card-main">${t.name}</div><span class="list-arrow">›</span>`;
    card.onclick = () => {
      state.team  = t.name;
      state.sheet = t.sheet;
      loadGames(tournament.id, t.name, t.sheet);
    };
    list.appendChild(card);
  });
  el.appendChild(list);
}

// ── Games ──────────────────────────────────────────────────────────────────────
async function loadGames(tournamentId, team, sheet) {
  const el = document.getElementById('games-content');
  el.innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
  showView('view-games');
  updateBreadcrumb();

  const url = `/api/games/${encodeURIComponent(tournamentId)}/${encodeURIComponent(team)}?sheet=${encodeURIComponent(sheet)}`;
  const res  = await fetch(url);
  const data = await res.json();

  el.innerHTML = '';

  if (!data.played.length && !data.upcoming.length) {
    el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--muted)">No games found.</div>`;
    return;
  }

  if (data.played.length) {
    const grp = document.createElement('div');
    grp.className = 'games-group';
    grp.innerHTML = '<div class="games-group-title">Results</div>';
    data.played.forEach(g => grp.appendChild(buildResultCard(g)));
    el.appendChild(grp);
  }

  if (data.upcoming.length) {
    const grp = document.createElement('div');
    grp.className = 'games-group';
    grp.innerHTML = '<div class="games-group-title">Upcoming Games</div>';
    data.upcoming.forEach(g => grp.appendChild(buildUpcomingCard(g, tournamentId, team)));
    el.appendChild(grp);
  }
}

function buildResultCard(g) {
  const card = document.createElement('div');
  card.className = 'game-card';

  const cls   = g.result === 'win' ? 'win' : g.result === 'loss' ? 'loss' : 'tie';
  const label = g.result === 'win' ? 'Win'  : g.result === 'loss' ? 'Loss' : 'Tie';

  card.innerHTML = `
    <div class="game-card-header">
      <div class="game-card-meta">
        <div class="game-card-datetime">${g.date} · ${g.time}</div>
        <div class="game-card-location">📍 ${g.location}</div>
      </div>
      <span class="result-pill ${cls}">${label}</span>
    </div>
    <div class="game-card-body">
      <div class="game-opponent">
        <span class="vs">vs</span>
        <span class="opponent-name">${g.opponent}</span>
      </div>
      <div class="game-score">${g.score}</div>
      <div class="game-tags">
        <span class="tag">You play <strong>${g.your_color}</strong></span>
        ${g.comments ? `<span class="tag">${g.comments}</span>` : ''}
      </div>
    </div>`;
  return card;
}

function buildUpcomingCard(g, tournamentId, team) {
  const card = document.createElement('div');
  card.className = 'game-card';

  let bodyHtml = `
    <div class="game-card-header">
      <div class="game-card-meta">
        <div class="game-card-datetime">${g.date} · ${g.time}</div>
        <div class="game-card-location">📍 ${g.location}</div>
      </div>
    </div>
    <div class="game-card-body">
      <div class="game-opponent">
        <span class="vs">vs</span>
        <span class="opponent-name">${g.opponent}</span>
      </div>
      <div class="game-tags">
        <span class="tag">You play <strong>${g.your_color}</strong></span>
        ${g.comments ? `<span class="tag">${g.comments}</span>` : ''}
      </div>`;

  // Locked result
  if (g.lock) {
    const icon = g.lock.trojan_won ? '✅' : '❌';
    const txt  = g.lock.trojan_won
      ? `${g.lock.team} won this game`
      : `${g.lock.team} lost this game`;

    let nextHtml = '';
    if (g.lock.next) {
      const n = g.lock.next;
      nextHtml = `
        <div class="next-game-box">
          <div class="next-game-label">Next Game</div>
          <div class="next-game-opponent">vs ${n.opponent}</div>
          <div class="next-game-meta">${n.date} · ${n.time} · ${n.location}</div>
        </div>`;
    } else {
      nextHtml = `<div class="next-game-box"><div class="next-game-label">Next Game</div><div class="next-game-meta">No further game found</div></div>`;
    }

    bodyHtml += `
      <div class="locked-box">
        <div class="locked-result"><span class="locked-icon">${icon}</span>${txt}</div>
        ${nextHtml}
        <span class="correct-link" onclick="unlockResult('${tournamentId}','${g.game_id}',this)">Incorrect? Correct this 🔒</span>
      </div>`;

  // Yes/No prompt
  } else {
    // Confidence indicator
    if (g.confidence) {
      const icons = { green:'🟢', yellow:'🟡', red:'🔴' };
      const msgs  = { green:'Bracket path confirmed', yellow:'Prediction may change', red:'Too early to call' };
      bodyHtml += `
        <div class="conf-banner ${g.confidence}">
          <span class="conf-icon">${icons[g.confidence]}</span>
          <div class="conf-text">
            <strong>${msgs[g.confidence]}</strong>
            ${g.conf_msg ? `<br><span style="font-size:12px">${g.conf_msg}</span>` : ''}
            ${(g.confidence === 'yellow' || g.confidence === 'red')
              ? `<br><span class="conf-upload-link" onclick="openUpload()">Upload latest schedule to improve this →</span>`
              : ''}
          </div>
        </div>`;
    }

    // What's next scenarios
    if (g.scenarios && (g.scenarios.win || g.scenarios.lose)) {
      let rows = '';
      if (g.scenarios.win) {
        const n = g.scenarios.win;
        rows += `
          <div class="scenario-row win-row">
            <span class="scenario-icon">✅</span>
            <div>
              <div class="scenario-label">If you win</div>
              <div class="scenario-opponent">vs ${n.opponent}</div>
              <div class="scenario-when">${n.date} · ${n.time} · ${n.location}</div>
            </div>
          </div>`;
      }
      if (g.scenarios.lose) {
        const n = g.scenarios.lose;
        rows += `
          <div class="scenario-row lose-row">
            <span class="scenario-icon">❌</span>
            <div>
              <div class="scenario-label">If you lose</div>
              <div class="scenario-opponent">vs ${n.opponent}</div>
              <div class="scenario-when">${n.date} · ${n.time} · ${n.location}</div>
            </div>
          </div>`;
      }
      bodyHtml += `
        <div class="scenarios-box">
          <div class="scenarios-title">What's Next</div>
          ${rows}
        </div>`;
    }

    // Yes/No prompt
    bodyHtml += `
      <div class="yn-box">
        <div class="yn-question">Did ${team} beat ${g.opponent.split('→').pop().trim().split('(')[0].trim()}?</div>
        <div class="yn-buttons">
          <button class="yn-btn yes" onclick="lockResult('${tournamentId}','${g.game_id}',true,'${team}',this)">✅ Yes, we won</button>
          <button class="yn-btn no"  onclick="lockResult('${tournamentId}','${g.game_id}',false,'${team}',this)">❌ No, we lost</button>
        </div>
      </div>`;
  }

  bodyHtml += `</div>`;
  card.innerHTML = bodyHtml;
  return card;
}

// ── Result locking ─────────────────────────────────────────────────────────────
async function lockResult(tournamentId, gameId, won, team, btn) {
  btn.disabled = true;
  const res  = await fetch(`/api/result/${tournamentId}/${gameId}`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ trojan_won: won, team })
  });
  if (res.ok) {
    loadGames(tournamentId, state.team, state.sheet);
  }
}

function unlockResult(tournamentId, gameId, linkEl) {
  openPwModal(`Unlock this result so it can be changed.`, async (pw) => {
    const res = await fetch(`/api/result/${tournamentId}/${gameId}/unlock`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    if (res.ok) {
      closePwModal();
      loadGames(tournamentId, state.team, state.sheet);
      return true;
    }
    return false;
  });
}

// ── Upload ─────────────────────────────────────────────────────────────────────
function openUpload() {
  pendingFile = null;
  document.getElementById('upload-pw').value   = '';
  document.getElementById('drop-text').textContent = 'Tap to select Excel file';
  document.getElementById('upload-btn').disabled   = true;
  document.getElementById('upload-msg').style.display = 'none';
  document.getElementById('upload-overlay').classList.add('visible');
}

function closeUpload(e) {
  if (e && e.target !== document.getElementById('upload-overlay')) return;
  document.getElementById('upload-overlay').classList.remove('visible');
}

function handleFileSelect(input) {
  if (input.files.length) {
    pendingFile = input.files[0];
    document.getElementById('drop-text').textContent = pendingFile.name;
    document.getElementById('upload-btn').disabled = false;
  }
}

// Drag and drop
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave',  () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.name.endsWith('.xlsx')) {
    pendingFile = f;
    document.getElementById('drop-text').textContent = f.name;
    document.getElementById('upload-btn').disabled   = false;
  }
});

async function doUpload() {
  const pw  = document.getElementById('upload-pw').value;
  const msg = document.getElementById('upload-msg');
  if (!pendingFile || !pw) return;

  const btn = document.getElementById('upload-btn');
  btn.disabled   = true;
  btn.textContent = 'Uploading…';

  const fd = new FormData();
  fd.append('password', pw);
  fd.append('file', pendingFile);

  const res = await fetch('/api/upload', { method: 'POST', body: fd });
  msg.style.display = 'block';

  if (res.ok) {
    msg.className   = 'upload-msg success';
    msg.textContent = '✅ Schedule uploaded successfully!';
    setTimeout(() => {
      document.getElementById('upload-overlay').classList.remove('visible');
      loadTournaments();
    }, 1500);
  } else if (res.status === 403) {
    msg.className   = 'upload-msg error';
    msg.textContent = '❌ Incorrect password.';
    btn.disabled    = false;
    btn.textContent = 'Upload Schedule';
  } else {
    msg.className   = 'upload-msg error';
    msg.textContent = '❌ Upload failed. Make sure it\'s a valid .xlsx file.';
    btn.disabled    = false;
    btn.textContent = 'Upload Schedule';
  }
}

// ── Password modal ─────────────────────────────────────────────────────────────
function openPwModal(msg, callback) {
  pwCallback = callback;
  document.getElementById('pw-modal-msg').textContent   = msg;
  document.getElementById('pw-modal-input').value       = '';
  document.getElementById('pw-error').style.display     = 'none';
  document.getElementById('pw-overlay').classList.add('visible');
  setTimeout(() => document.getElementById('pw-modal-input').focus(), 100);
}

function closePwModal(e) {
  if (e && e.target !== document.getElementById('pw-overlay')) return;
  document.getElementById('pw-overlay').classList.remove('visible');
  pwCallback = null;
}

async function submitPw() {
  if (!pwCallback) return;
  const pw  = document.getElementById('pw-modal-input').value;
  const ok  = await pwCallback(pw);
  if (!ok) {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-modal-input').value   = '';
    document.getElementById('pw-modal-input').focus();
  }
}

// ── Init ───────────────────────────────────────────────────────────────────────
loadTournaments();
</script>
