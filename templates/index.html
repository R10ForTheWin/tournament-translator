<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TT Scheduler">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/static/apple-touch-icon.png">
  <title>Tournament Translator</title>
  <style>
    :root {
      --cardinal:      #9d2235;
      --cardinal-dark: #7a1a28;
      --gold:          #ffd700;
      --white:         #ffffff;
      --bg:            #111111;
      --card:          #1e1e1e;
      --card-header:   #171717;
      --dark:          #ffffff;
      --muted:         #aeaeb2;
      --border:        rgba(255,255,255,0.09);
      --win-bg:        rgba(40,160,70,0.15);
      --win-text:      #5dba70;
      --loss-bg:       rgba(157,34,53,0.18);
      --loss-text:     #e0687a;
      --tie-bg:        rgba(255,215,0,0.1);
      --tie-text:      #ffd700;
      --radius:        12px;
      --radius-sm:     8px;
      --shadow:        0 4px 24px rgba(0,0,0,0.5);
      --shadow-sm:     0 2px 8px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100vh;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    /* ── Hero (home view only) ── */
    #hero-wrap {
      background: var(--bg);
    }
    .hero-safe-spacer { height: env(safe-area-inset-top); }
    .hero {
      text-align: center;
      padding: 32px 24px 24px;
    }
    .hero-logo {
      width: 340px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .gold-bar { height: 3px; background: var(--gold); }

    /* ── Subnav (sub-views only) ── */
    #subnav-wrap {
      background: var(--cardinal);
      padding-top: env(safe-area-inset-top);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    .subnav-inner {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 8px;
    }
    .back-btn {
      background: none; border: none;
      color: var(--gold);
      font-size: 17px; font-weight: 600;
      cursor: pointer; padding: 8px 10px;
      font-family: inherit; flex-shrink: 0;
    }
    .back-btn:active { opacity: 0.7; }
    .subnav-title {
      flex: 1; text-align: center;
      font-size: 15px; font-weight: 700;
      color: var(--white);
      text-transform: uppercase; letter-spacing: 0.05em;
      padding-right: 48px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Main ── */
    main { padding: 20px 16px; max-width: 540px; margin: 0 auto; }

    /* ── Section labels ── */
    .section-label {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--muted); margin: 0 4px 10px;
    }
    .section-label.accent { color: var(--gold); }

    /* ── Card lists ── */
    .card-list {
      display: flex; flex-direction: column;
      margin-bottom: 28px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .list-card {
      background: var(--card);
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 15px 16px;
      cursor: pointer;
      transition: background 0.1s;
      border-bottom: 1px solid var(--border);
    }
    .card-list .list-card:last-child { border-bottom: none; }
    .list-card:active { background: #2a2a2a; }

    .list-card-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .list-card-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot-upcoming { background: var(--cardinal); }
    .dot-upload   { background: var(--gold); }
    .dot-past     { background: var(--muted); opacity: 0.35; }

    .list-card-info { min-width: 0; }
    .list-card-main { font-size: 16px; font-weight: 600; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-card-sub  { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .list-card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .badge {
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.07em; white-space: nowrap;
    }
    .badge-past      { background: rgba(255,255,255,0.08); color: var(--muted); }
    .badge-upload    { background: var(--gold); color: #3a2800; }
    .badge-scheduled { background: var(--cardinal); color: var(--white); }

    .list-arrow { font-size: 18px; color: rgba(255,255,255,0.2); font-weight: 300; }

    /* ── Divider ── */
    .section-divider { display: flex; align-items: center; gap: 10px; margin: 8px 0 16px; }
    .section-divider-line { flex: 1; height: 1px; background: var(--border); }
    .section-divider-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); white-space: nowrap; }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Game cards ── */
    .games-group { margin-bottom: 24px; }
    .games-group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--gold); margin-bottom: 12px; padding-left: 2px; }

    .game-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border); }

    .game-card-header { padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--card-header); }
    .game-card-meta { flex: 1; }
    .game-card-datetime { font-size: 13px; font-weight: 600; color: var(--white); }
    .game-card-location { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .result-pill { font-size: 11px; font-weight: 800; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
    .result-pill.win  { background: var(--win-bg);  color: var(--win-text); }
    .result-pill.loss { background: var(--loss-bg); color: var(--loss-text); }
    .result-pill.tie  { background: var(--tie-bg);  color: var(--tie-text); }

    .game-card-body { padding: 14px; }
    .game-opponent { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .vs { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; flex-shrink: 0; }
    .opponent-name { font-size: 18px; font-weight: 700; color: var(--white); line-height: 1.2; }
    .game-score { font-size: 28px; font-weight: 900; color: var(--gold); letter-spacing: -1px; margin-bottom: 8px; }
    .game-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag { font-size: 12px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; color: var(--muted); font-weight: 500; }
    .h2h-line { font-size: 11px; color: var(--muted); margin: 2px 0 6px; letter-spacing: 0.02em; }

    /* ── Confidence ── */
    .conf-banner { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: var(--radius-sm); margin-top: 12px; font-size: 13px; }
    .conf-banner.yellow { background: var(--tie-bg);  color: var(--tie-text); }
    .conf-banner.red    { background: var(--loss-bg); color: var(--loss-text); }
    .conf-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .conf-text { line-height: 1.4; }
    .conf-upload-link { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--gold); text-decoration: underline; cursor: pointer; }

    /* ── Scenarios ── */
    .scenarios-box { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
    .scenarios-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
    .scenario-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 6px; }
    .scenario-row.win-row  { background: var(--win-bg); }
    .scenario-row.lose-row { background: var(--loss-bg); }
    .scenario-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .scenario-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .scenario-opponent { font-size: 14px; font-weight: 700; color: var(--white); margin: 2px 0; }
    .scenario-when { font-size: 12px; color: var(--muted); }

    /* ── Yes/No ── */
    .yn-box { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 14px; }
    .yn-question { font-size: 14px; font-weight: 600; color: var(--white); margin-bottom: 12px; line-height: 1.3; }
    .yn-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .yn-btn { padding: 13px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 800; cursor: pointer; transition: transform 0.1s; text-transform: uppercase; letter-spacing: 0.06em; font-family: inherit; }
    .yn-btn:active { transform: scale(0.97); }
    .yn-btn.yes { background: var(--cardinal); color: var(--white); }
    .yn-btn.no  { background: rgba(255,255,255,0.1); color: var(--white); border: 1px solid var(--border); }

    /* ── Locked ── */
    .locked-box { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 14px; }
    .locked-result { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 10px; }
    .locked-icon { font-size: 18px; }
    .next-game-box { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; }
    .next-game-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 4px; }
    .next-game-opponent { font-size: 16px; font-weight: 700; color: var(--white); }
    .next-game-meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .correct-link { font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 4px; }

    /* ── Upload sheet ── */
    .upload-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
    .upload-overlay.visible { display: flex; }
    .upload-sheet { background: #1e1e1e; border-radius: 20px 20px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); width: 100%; max-width: 540px; animation: slideUp 0.25s ease; border-top: 1px solid var(--border); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .upload-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 0 auto 18px; }
    .upload-title { font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 16px; color: var(--white); }
    .pw-input { display: block; width: 100%; padding: 13px 14px; font-size: 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 10px; font-family: inherit; outline: none; background: rgba(255,255,255,0.06); color: var(--white); }
    .pw-input:focus { border-color: var(--cardinal); }
    .drop-zone { border: 2px dashed rgba(255,255,255,0.15); border-radius: var(--radius-sm); padding: 24px; text-align: center; cursor: pointer; margin-bottom: 10px; transition: border-color 0.2s, background 0.2s; color: var(--muted); font-size: 14px; }
    .drop-zone.drag-over { border-color: var(--cardinal); background: rgba(157,34,53,0.1); }
    .drop-zone .drop-icon { font-size: 28px; margin-bottom: 6px; }
    .drop-zone .drop-text { font-weight: 600; color: var(--white); }
    .drop-zone .drop-sub { font-size: 12px; margin-top: 3px; }
    .drop-zone input[type=file] { display: none; }
    .upload-btn { width: 100%; padding: 14px; background: var(--cardinal); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; cursor: pointer; font-family: inherit; }
    .upload-btn:active { opacity: 0.85; }
    .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .cancel-btn { width: 100%; padding: 12px; background: none; color: var(--muted); border: none; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; font-family: inherit; }
    .upload-msg { font-size: 13px; text-align: center; padding: 8px; border-radius: var(--radius-sm); margin-top: 8px; }
    .upload-msg.error   { background: var(--loss-bg); color: var(--loss-text); }
    .upload-msg.success { background: var(--win-bg);  color: var(--win-text); }

    /* ── Password modal ── */
    .pw-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
    .pw-overlay.visible { display: flex; }
    .pw-modal { background: #1e1e1e; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; width: 100%; max-width: 340px; box-shadow: var(--shadow); }
    .pw-modal-title { font-size: 17px; font-weight: 800; text-transform: uppercase; margin-bottom: 14px; color: var(--white); }
    .pw-modal-msg { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
    .pw-modal-input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 10px; font-family: inherit; outline: none; background: rgba(255,255,255,0.06); color: var(--white); }
    .pw-modal-input:focus { border-color: var(--cardinal); }
    .pw-modal-btn { width: 100%; padding: 13px; background: var(--cardinal); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
    .pw-modal-cancel { width: 100%; padding: 11px; background: none; color: var(--muted); border: none; font-size: 14px; cursor: pointer; font-family: inherit; }
    .pw-error { font-size: 13px; color: var(--loss-text); margin-bottom: 8px; display: none; }

    /* ── Spinner ── */
    .spinner-wrap { display: flex; justify-content: center; padding: 48px 0; }
    .wp-spinner { display: block; }

    /* ── Stripe bars ── */
    .stripe-bar { line-height: 0; overflow: hidden; }

    /* ── Add to Home Screen banner ── */
    #a2hs-banner {
      position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%);
      background: #2a2a2a; border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px; padding: 12px 16px 12px 14px;
      display: flex; align-items: flex-start; gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      max-width: calc(100vw - 32px); width: 320px;
      z-index: 400; animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform: translateX(-50%) translateY(12px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }
    #a2hs-banner .a2hs-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
    #a2hs-banner .a2hs-text { flex: 1; font-size: 13px; line-height: 1.45; color: var(--white); }
    #a2hs-banner .a2hs-text strong { display: block; margin-bottom: 3px; font-size: 14px; }
    #a2hs-banner .a2hs-text span { color: var(--muted); }
    #a2hs-banner .a2hs-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 0 0 6px; line-height: 1; flex-shrink: 0; font-family: inherit; }
  </style>
</head>
<body>

<!-- Test mode button — fixed bottom-right corner, inconspicuous -->
<button id="test-mode-btn" onclick="toggleTestMode()"
  style="position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));right:14px;
         background:none;border:none;color:rgba(255,255,255,0.12);
         font-size:9px;letter-spacing:0.12em;text-transform:uppercase;padding:6px 4px;
         cursor:pointer;z-index:50;font-family:inherit">TEST</button>

<!-- Hero — home view only -->
<div id="hero-wrap">
  <div class="hero-safe-spacer"></div>
  <!-- Top stripe bar: flat left, curl upward right, dark → gold -->
  <div class="stripe-bar">
    <svg viewBox="0 0 1440 110" preserveAspectRatio="none" style="display:block;width:100%;height:70px">
      <path d="M 0 0 C 792 0, 1180.8 -140, 1440 -140 L 1440 -118 C 1180.8 -118, 792 22, 0 22 Z" fill="#0d0507"/>
      <path d="M 0 22 C 792 22, 1180.8 -118, 1440 -118 L 1440 -96 C 1180.8 -96, 792 44, 0 44 Z" fill="#7a1a28"/>
      <path d="M 0 44 C 792 44, 1180.8 -96, 1440 -96 L 1440 -74 C 1180.8 -74, 792 66, 0 66 Z" fill="#9d2235"/>
      <path d="M 0 66 C 792 66, 1180.8 -74, 1440 -74 L 1440 -52 C 1180.8 -52, 792 88, 0 88 Z" fill="#c8a400"/>
      <path d="M 0 88 C 792 88, 1180.8 -52, 1440 -52 L 1440 -30 C 1180.8 -30, 792 110, 0 110 Z" fill="#ffd700"/>
    </svg>
  </div>
  <div class="hero">
    <img src="/static/logo.png" class="hero-logo" alt="Tournament Translator">
  </div>
  <!-- Bottom stripe bar: flat right, curl downward left, gold → dark -->
  <div class="stripe-bar">
    <svg viewBox="0 0 1440 250" preserveAspectRatio="none" style="display:block;width:100%;height:70px">
      <path d="M 0 140 C 259.2 140, 648 0, 1440 0 L 1440 22 C 648 22, 259.2 162, 0 162 Z" fill="#ffd700"/>
      <path d="M 0 162 C 259.2 162, 648 22, 1440 22 L 1440 44 C 648 44, 259.2 184, 0 184 Z" fill="#c8a400"/>
      <path d="M 0 184 C 259.2 184, 648 44, 1440 44 L 1440 66 C 648 66, 259.2 206, 0 206 Z" fill="#9d2235"/>
      <path d="M 0 206 C 259.2 206, 648 66, 1440 66 L 1440 88 C 648 88, 259.2 228, 0 228 Z" fill="#7a1a28"/>
      <path d="M 0 228 C 259.2 228, 648 88, 1440 88 L 1440 110 C 648 110, 259.2 250, 0 250 Z" fill="#0d0507"/>
    </svg>
  </div>
</div>

<!-- Subnav — sub-views only -->
<div id="subnav-wrap" style="display:none">
  <div class="subnav-inner">
    <button class="back-btn" id="back-btn">‹ Back</button>
    <div class="subnav-title" id="subnav-title"></div>
  </div>
  <div class="gold-bar"></div>
</div>

<main>
  <div id="view-tournaments" class="view active">
    <div id="tournament-list-content">
      <div class="spinner-wrap"><svg class="wp-spinner" viewBox="0 0 36 36" width="36" height="36" fill="none" stroke="var(--cardinal)" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="15" stroke-width="1.5"/><g class="wp-seams" stroke-width="1.3"><path d=""/><path d=""/><path d=""/><path d=""/></g></svg></div>
    </div>
    <div style="text-align:center; margin-top:32px; padding-bottom:8px;">
      <button onclick="shareApp()" style="
        background: none;
        border: 1.5px solid rgba(255,255,255,0.15);
        border-radius: 20px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        padding: 10px 22px;
        cursor: pointer;
        letter-spacing: 0.04em;
      ">⬆ Share App with Teammate</button>
    </div>
  </div>
  <div id="view-teams" class="view">
    <div id="team-list-content"></div>
  </div>
  <div id="view-games" class="view">
    <div id="games-content"></div>
  </div>
</main>

<!-- Upload sheet -->
<div class="upload-overlay" id="upload-overlay" onclick="closeUpload(event)">
  <div class="upload-sheet" onclick="event.stopPropagation()">
    <div class="upload-handle"></div>
    <div class="upload-title">Upload Schedule</div>
    <input type="password" class="pw-input" id="upload-pw" placeholder="Password" autocomplete="current-password">
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" accept=".xlsx" onchange="handleFileSelect(this)">
      <div class="drop-icon">📂</div>
      <div class="drop-text" id="drop-text">Tap to select Excel file</div>
      <div class="drop-sub">.xlsx files only</div>
    </div>
    <button class="upload-btn" id="upload-btn" onclick="doUpload()" disabled>Upload Schedule</button>
    <button class="cancel-btn" onclick="closeUpload()">Cancel</button>
    <div class="upload-msg" id="upload-msg" style="display:none"></div>
  </div>
</div>

<!-- Add to Home Screen banner (iOS only, shown once) -->
<div id="a2hs-banner" style="display:none">
  <div class="a2hs-icon">🏠</div>
  <div class="a2hs-text">
    <strong>Add to Home Screen</strong>
    <span>Tap <b>⬆</b> then <b>"Add to Home Screen"</b> for quick access all season.</span>
  </div>
  <button class="a2hs-close" onclick="dismissA2HS()">✕</button>
</div>

<!-- Password modal -->
<div class="pw-overlay" id="pw-overlay" onclick="closePwModal(event)">
  <div class="pw-modal" onclick="event.stopPropagation()">
    <div class="pw-modal-title">🔒 Confirm</div>
    <div class="pw-modal-msg" id="pw-modal-msg">Enter the admin password to make this change.</div>
    <div class="pw-error" id="pw-error">Incorrect password. Try again.</div>
    <input type="password" class="pw-modal-input" id="pw-modal-input" placeholder="Password"
           autocomplete="current-password" onkeydown="if(event.key==='Enter') submitPw()">
    <button class="pw-modal-btn" onclick="submitPw()">Confirm</button>
    <button class="pw-modal-cancel" onclick="closePwModal()">Cancel</button>
  </div>
</div>

<script>
let state = { tournament: null, team: null, sheet: null, friendly: null };
let testMode    = false;
let pendingFile = null;
let pwCallback  = null;

// ── Add to Home Screen prompt ───────────────────────────────────────────────────
function isIosSafari() {
  const ua = navigator.userAgent;
  return /iP(hone|ad|od)/.test(ua) && /WebKit/.test(ua) && !/CriOS|FxiOS|OPiOS|EdgiOS/.test(ua);
}
function isStandalone() {
  return window.navigator.standalone === true;
}
function dismissA2HS() {
  document.getElementById('a2hs-banner').style.display = 'none';
  localStorage.setItem('a2hs_dismissed', '1');
}
function maybeShowA2HS() {
  if (!isIosSafari() || isStandalone()) return;
  if (localStorage.getItem('a2hs_dismissed')) return;
  setTimeout(() => {
    document.getElementById('a2hs-banner').style.display = 'flex';
  }, 2000);
}

async function shareApp() {
  const url  = location.origin;
  const text = 'Track Trojan water polo schedules & results all season.';
  if (navigator.share) {
    try { await navigator.share({ title: 'Tournament Translator', text, url }); } catch(e) {}
  } else {
    await navigator.clipboard.writeText(url);
    alert('Link copied to clipboard!');
  }
}

function toggleTestMode() {
  testMode = !testMode;
  const btn = document.getElementById('test-mode-btn');
  btn.textContent = testMode ? 'TEST MODE: ON' : 'TEST MODE: OFF';
  btn.style.color  = testMode ? 'rgba(255,200,0,0.7)' : 'rgba(255,255,255,0.3)';
  btn.style.borderColor = testMode ? 'rgba(255,200,0,0.4)' : 'rgba(255,255,255,0.15)';
}

// ── Views ──────────────────────────────────────────────────────────────────────
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  const isHome = id === 'view-tournaments';
  document.getElementById('hero-wrap').style.display   = isHome ? '' : 'none';
  document.getElementById('subnav-wrap').style.display = isHome ? 'none' : '';
}

function updateSubnav() {
  const view = document.querySelector('.view.active').id;
  const titleEl = document.getElementById('subnav-title');
  const backBtn = document.getElementById('back-btn');
  if (view === 'view-teams') {
    titleEl.textContent = state.tournament?.name || '';
    backBtn.onclick = goHome;
  } else if (view === 'view-games') {
    titleEl.textContent = state.friendly || state.team || '';
    backBtn.onclick = goTournament;
  }
}

function goHome()       { showView('view-tournaments'); }
function goTournament() { showView('view-teams'); updateSubnav(); }

// ── Tournaments ────────────────────────────────────────────────────────────────
async function loadTournaments() {
  const res  = await fetch('/api/tournaments');
  const list = await res.json();
  const upcoming = list.filter(t => !t.past);
  const past     = list.filter(t =>  t.past);
  const el = document.getElementById('tournament-list-content');
  el.innerHTML = '';

  if (upcoming.length) {
    const lbl = document.createElement('p');
    lbl.className = 'section-label accent';
    lbl.textContent = 'Upcoming';
    el.appendChild(lbl);
    el.appendChild(makeTournamentCards(upcoming));
  }
  if (past.length) {
    if (upcoming.length) {
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.innerHTML = `<div class="section-divider-line"></div><div class="section-divider-label">Past</div><div class="section-divider-line"></div>`;
      el.appendChild(div);
    }
    el.appendChild(makeTournamentCards(past));
  }
}

function makeTournamentCards(tournaments) {
  const list = document.createElement('div');
  list.className = 'card-list';
  tournaments.forEach(t => {
    const card = document.createElement('div');
    card.className = 'list-card';
    let badgeHtml = '', dotClass = '';
    if (!t.has_excel) {
      badgeHtml = `<span class="badge badge-upload">Upload Schedule</span>`;
      dotClass  = 'dot-upload';
    } else if (!t.past) {
      badgeHtml = `<span class="badge badge-scheduled">View Schedule</span>`;
      dotClass  = 'dot-upcoming';
    } else {
      badgeHtml = `<span class="badge badge-past">Done</span>`;
      dotClass  = 'dot-past';
    }
    card.innerHTML = `
      <div class="list-card-left">
        <div class="list-card-dot ${dotClass}"></div>
        <div class="list-card-info">
          <div class="list-card-main">${t.name}</div>
          <div class="list-card-sub">${t.dates}</div>
        </div>
      </div>
      <div class="list-card-right">${badgeHtml}<span class="list-arrow">›</span></div>`;
    card.onclick = () => {
      if (!t.has_excel) { openUpload(); return; }
      state.tournament = t;
      loadTeams(t);
    };
    list.appendChild(card);
  });
  return list;
}

// ── Teams ──────────────────────────────────────────────────────────────────────
// Extract age-group label from a friendly name, stripping any tier suffix.
// "Boys 16U Gold" → "Boys 16U"   "Boys 19U" → "Boys 19U"
const TIER_WORDS = new Set(['gold','cardinal','silver','bronze','platinum']);
function ageGroupOf(friendly) {
  if (!friendly) return friendly;
  const parts = friendly.split(' ');
  const last = parts[parts.length - 1].toLowerCase();
  return TIER_WORDS.has(last) ? parts.slice(0, -1).join(' ') : friendly;
}

function renderTeamList(el, tournament, teams, label) {
  el.innerHTML = '';
  const lbl = document.createElement('p');
  lbl.className = 'section-label';
  lbl.textContent = label;
  el.appendChild(lbl);

  const list = document.createElement('div');
  list.className = 'card-list';
  teams.forEach(t => {
    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `
      <div class="list-card-left">
        <div class="list-card-dot dot-upcoming"></div>
        <div class="list-card-info">
          <div class="list-card-main">${t.label}</div>
        </div>
      </div>
      <span class="list-arrow">›</span>`;
    card.onclick = t.onclick;
    list.appendChild(card);
  });
  el.appendChild(list);
}

async function loadTeams(tournament) {
  const el = document.getElementById('team-list-content');
  el.innerHTML = '<div class="spinner-wrap"><svg class="wp-spinner" viewBox="0 0 36 36" width="36" height="36" fill="none" stroke="var(--cardinal)" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="15" stroke-width="1.5"/><g class="wp-seams" stroke-width="1.3"><path d=""/><path d=""/><path d=""/><path d=""/></g></svg></div>';
  showView('view-teams');
  updateSubnav();

  const res   = await fetch(`/api/trojan-teams/${encodeURIComponent(tournament.id)}`);
  const teams = await res.json();

  if (!teams.length) {
    el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--muted)">No Trojan teams found in this file.</div>`;
    return;
  }

  // Group by age group
  const groups = {};
  teams.forEach(t => {
    const ag = ageGroupOf(t.friendly || t.name);
    if (!groups[ag]) groups[ag] = [];
    groups[ag].push(t);
  });

  const agKeys = Object.keys(groups);

  // If only one age group with one team — skip straight to games
  if (agKeys.length === 1 && groups[agKeys[0]].length === 1) {
    const t = groups[agKeys[0]][0];
    state.team = t.name; state.sheet = t.sheet; state.friendly = t.friendly || t.name;
    loadGames(tournament.id, t.name, t.sheet);
    return;
  }

  // Build age-group rows
  const rows = agKeys.map(ag => ({
    label: ag,
    onclick: () => {
      const members = groups[ag];
      if (members.length === 1) {
        const t = members[0];
        state.team = t.name; state.sheet = t.sheet; state.friendly = t.friendly || t.name;
        loadGames(tournament.id, t.name, t.sheet);
      } else {
        // Show tier picker
        const tierRows = members.map(t => {
          const parts = (t.friendly || t.name).split(' ');
          const tierLabel = TIER_WORDS.has(parts[parts.length-1].toLowerCase())
            ? parts[parts.length-1] : t.name;
          return {
            label: tierLabel,
            onclick: () => {
              state.team = t.name; state.sheet = t.sheet; state.friendly = t.friendly || t.name;
              loadGames(tournament.id, t.name, t.sheet);
            }
          };
        });
        renderTeamList(el, tournament, tierRows, ag);
      }
    }
  }));

  renderTeamList(el, tournament, rows, 'Select Age Group');
}

// ── H2H helpers ────────────────────────────────────────────────────────────────
const _TROJAN_TIER_JS = {
  cardinal:'A', red:'A', platinum:'A',
  gold:'B', blue:'B',
  silver:'C', white:'C', bronze:'C',
};
const _STRIP_PREFIX_JS = /^(?:\d+(?:st|nd|rd|th)[A-Z]-|[A-Z]\d+\([^)]+\)-|[WL]#[^-]+-|[A-Z]\d+-|\d+-)/i;
const _STRIP_COLOR_JS  = /\s+(gold|silver|cardinal|red|blue|white|platinum|bronze|black|green|orange|purple|maroon|gray|grey)\s*$/i;

function normalizeOpp(raw) {
  let name = raw.trim().replace(_STRIP_PREFIX_JS, '').trim();
  if (/TROJAN/i.test(name)) {
    for (const [color, tier] of Object.entries(_TROJAN_TIER_JS)) {
      if (new RegExp(`\\b${color}\\b`, 'i').test(name)) return [name.toUpperCase(), tier];
    }
    return ['TROJAN', 'A'];
  }
  let m = name.match(/^(.*?)\s+\(?([ABC])\)?\s*$/i);
  if (m) return [m[1].trim().toUpperCase(), m[2].toUpperCase()];
  m = name.match(/^(.*?)\s+([123])\s*$/);
  if (m) return [m[1].trim().toUpperCase(), 'ABC'[parseInt(m[2])-1]];
  const club = name.replace(_STRIP_COLOR_JS, '').trim();
  return [club.toUpperCase(), null];
}
function h2hKey(raw) {
  const [club, tier] = normalizeOpp(raw);
  return `${club}|${tier||''}`;
}
function h2hSummary(h2h, opponentRaw) {
  if (!h2h) return '';
  const key = h2hKey(opponentRaw);
  // Also try fuzzy: find any key whose club portion is a substring match
  let rec = h2h[key];
  if (!rec) {
    const [club] = normalizeOpp(opponentRaw);
    for (const [k, v] of Object.entries(h2h)) {
      const kclub = k.split('|')[0];
      if (kclub === club || kclub.includes(club) || club.includes(kclub)) { rec = v; break; }
    }
  }
  if (!rec) return '';
  const total = rec.wins + rec.losses + rec.ties;
  if (total === 0) return '';
  const tierLabel = rec.tier ? ` (${rec.tier})` : '';
  const record = `${rec.wins}W–${rec.losses}L${rec.ties ? '–'+rec.ties+'T' : ''}`;
  return `<div class="h2h-line">All-time${tierLabel}: ${record} in ${total} game${total>1?'s':''}</div>`;
}

// ── Games ──────────────────────────────────────────────────────────────────────
async function loadGames(tournamentId, team, sheet) {
  const el = document.getElementById('games-content');
  el.innerHTML = '<div class="spinner-wrap"><svg class="wp-spinner" viewBox="0 0 36 36" width="36" height="36" fill="none" stroke="var(--cardinal)" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="15" stroke-width="1.5"/><g class="wp-seams" stroke-width="1.3"><path d=""/><path d=""/><path d=""/><path d=""/></g></svg></div>';
  showView('view-games');
  updateSubnav();

  const [gamesRes, h2hRes] = await Promise.all([
    fetch(`/api/games/${encodeURIComponent(tournamentId)}/${encodeURIComponent(team)}?sheet=${encodeURIComponent(sheet)}`),
    fetch(`/api/h2h/${encodeURIComponent(team)}`),
  ]);
  const data = await gamesRes.json();
  const h2h  = h2hRes.ok ? await h2hRes.json() : null;
  el.innerHTML = '';

  if (!data.played.length && !data.upcoming.length) {
    el.innerHTML = `<div style="text-align:center;padding:48px 20px;color:var(--muted)">No games found.</div>`;
    return;
  }

  if (data.played.length) {
    const grp = document.createElement('div');
    grp.className = 'games-group';
    grp.innerHTML = '<div class="games-group-title">Results</div>';
    data.played.forEach(g => grp.appendChild(buildResultCard(g, h2h)));
    el.appendChild(grp);
  }
  if (data.upcoming.length) {
    const grp = document.createElement('div');
    grp.className = 'games-group';
    grp.innerHTML = '<div class="games-group-title">Upcoming Games</div>';
    data.upcoming.forEach(g => grp.appendChild(buildUpcomingCard(g, tournamentId, team, h2h)));
    el.appendChild(grp);
  }
}

function buildResultCard(g, h2h) {
  const card = document.createElement('div');
  card.className = 'game-card';
  const cls   = g.result === 'win' ? 'win' : g.result === 'loss' ? 'loss' : 'tie';
  const label = g.result === 'win' ? 'Win'  : g.result === 'loss' ? 'Loss' : 'Tie';
  card.innerHTML = `
    <div class="game-card-header">
      <div class="game-card-meta">
        <div class="game-card-datetime">${g.date} · ${g.time}</div>
        <div class="game-card-location">📍 ${g.location}</div>
      </div>
      <span class="result-pill ${cls}">${label}</span>
    </div>
    <div class="game-card-body">
      <div class="game-opponent"><span class="vs">vs</span><span class="opponent-name">${g.opponent}</span></div>
      ${h2hSummary(h2h, g.opponent)}
      <div class="game-score">${g.score}</div>
      ${g.comments ? `<div class="game-tags"><span class="tag">${g.comments}</span></div>` : ''}
    </div>`;
  return card;
}

function buildUpcomingCard(g, tournamentId, team, h2h) {
  const card = document.createElement('div');
  card.className = 'game-card';
  let body = `
    <div class="game-card-header">
      <div class="game-card-meta">
        <div class="game-card-datetime">${g.date} · ${g.time}</div>
        <div class="game-card-location">📍 ${g.location}</div>
      </div>
    </div>
    <div class="game-card-body">
      <div class="game-opponent"><span class="vs">vs</span><span class="opponent-name">${g.opponent}</span></div>
      ${h2hSummary(h2h, g.opponent)}
      ${g.comments ? `<div class="game-tags"><span class="tag">${g.comments}</span></div>` : ''}`;

  if (g.lock) {
    const icon = g.lock.trojan_won ? '✅' : '❌';
    const txt  = g.lock.trojan_won ? `${g.lock.team} won this game` : `${g.lock.team} lost this game`;
    const nextHtml = g.lock.next
      ? `<div class="next-game-box"><div class="next-game-label">Next Game</div><div class="next-game-opponent">vs ${g.lock.next.opponent}</div><div class="next-game-meta">${g.lock.next.date} · ${g.lock.next.time} · ${g.lock.next.location}</div></div>`
      : `<div class="next-game-box"><div class="next-game-label">Next Game</div><div class="next-game-meta">No further game found</div></div>`;
    body += `
      <div class="locked-box">
        <div class="locked-result"><span class="locked-icon">${icon}</span>${txt}</div>
        ${nextHtml}
        <span class="correct-link" onclick="unlockResult('${tournamentId}','${g.game_id}',this)">Incorrect? Correct this 🔒</span>
      </div>`;
  } else {
    // Yes/No question right below the game info
    body += `
      <div class="yn-box">
        <div class="yn-question">Did ${state.friendly || team} beat ${g.opponent}?</div>
        <div class="yn-buttons">
          <button class="yn-btn yes" onclick="lockResult('${tournamentId}','${g.game_id}',true,'${team}',this)">✅ Yes, we won</button>
          <button class="yn-btn no"  onclick="lockResult('${tournamentId}','${g.game_id}',false,'${team}',this)">❌ No, we lost</button>
        </div>
      </div>`;

    // Only show confidence warning for yellow/red — green is silent
    if (g.confidence && g.confidence !== 'green') {
      const icons = { yellow:'🟡', red:'🔴' };
      const msgs  = { yellow:'Prediction may change', red:'Too early to call' };
      body += `
        <div class="conf-banner ${g.confidence}">
          <span class="conf-icon">${icons[g.confidence]}</span>
          <div class="conf-text">
            <strong>${msgs[g.confidence]}</strong>
            ${g.conf_msg ? `<br><span style="font-size:12px">${g.conf_msg}</span>` : ''}
            <br><span class="conf-upload-link" onclick="openUpload()">Upload latest schedule to improve this →</span>
          </div>
        </div>`;
    }

    // What's Next scenarios
    if (g.scenarios && (g.scenarios.win || g.scenarios.lose)) {
      let rows = '';
      if (g.scenarios.win) {
        const n = g.scenarios.win;
        rows += `<div class="scenario-row win-row"><span class="scenario-icon">✅</span><div><div class="scenario-label">If you win</div><div class="scenario-opponent">vs ${n.opponent}</div><div class="scenario-when">${n.date} · ${n.time} · ${n.location}</div></div></div>`;
      }
      if (g.scenarios.lose) {
        const n = g.scenarios.lose;
        rows += `<div class="scenario-row lose-row"><span class="scenario-icon">❌</span><div><div class="scenario-label">If you lose</div><div class="scenario-opponent">vs ${n.opponent}</div><div class="scenario-when">${n.date} · ${n.time} · ${n.location}</div></div></div>`;
      }
      body += `<div class="scenarios-box"><div class="scenarios-title">What's Next</div>${rows}</div>`;
    }
  }
  body += `</div>`;
  card.innerHTML = body;
  return card;
}

// ── Result locking ─────────────────────────────────────────────────────────────
async function lockResult(tournamentId, gameId, won, team, btn) {
  if (testMode) {
    // Test mode: just reload games as if the result was locked, without saving
    btn.closest('.yn-box').innerHTML =
      `<div style="text-align:center;padding:8px;font-size:13px;color:var(--muted)">🧪 Test — not saved</div>`;
    return;
  }
  btn.disabled = true;
  const res = await fetch(`/api/result/${tournamentId}/${gameId}`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ trojan_won: won, team })
  });
  if (res.ok) loadGames(tournamentId, state.team, state.sheet);
}

function unlockResult(tournamentId, gameId) {
  openPwModal('Unlock this result so it can be changed.', async (pw) => {
    const res = await fetch(`/api/result/${tournamentId}/${gameId}/unlock`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw })
    });
    if (res.ok) { closePwModal(); loadGames(tournamentId, state.team, state.sheet); return true; }
    return false;
  });
}

// ── Upload ─────────────────────────────────────────────────────────────────────
function openUpload() {
  pendingFile = null;
  document.getElementById('upload-pw').value = '';
  document.getElementById('drop-text').textContent = 'Tap to select Excel file';
  document.getElementById('upload-btn').disabled = true;
  document.getElementById('upload-msg').style.display = 'none';
  document.getElementById('upload-overlay').classList.add('visible');
}
function closeUpload(e) {
  if (e && e.target !== document.getElementById('upload-overlay')) return;
  document.getElementById('upload-overlay').classList.remove('visible');
}
function handleFileSelect(input) {
  if (input.files.length) {
    pendingFile = input.files[0];
    document.getElementById('drop-text').textContent = pendingFile.name;
    document.getElementById('upload-btn').disabled = false;
  }
}
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.name.endsWith('.xlsx')) {
    pendingFile = f;
    document.getElementById('drop-text').textContent = f.name;
    document.getElementById('upload-btn').disabled = false;
  }
});
async function doUpload() {
  const pw = document.getElementById('upload-pw').value;
  const msg = document.getElementById('upload-msg');
  if (!pendingFile || !pw) return;
  const btn = document.getElementById('upload-btn');
  btn.disabled = true; btn.textContent = 'Uploading…';
  const fd = new FormData();
  fd.append('password', pw); fd.append('file', pendingFile);
  const res = await fetch('/api/upload', { method: 'POST', body: fd });
  msg.style.display = 'block';
  if (res.ok) {
    msg.className = 'upload-msg success'; msg.textContent = '✅ Schedule uploaded successfully!';
    setTimeout(() => { document.getElementById('upload-overlay').classList.remove('visible'); loadTournaments(); }, 1500);
  } else if (res.status === 403) {
    msg.className = 'upload-msg error'; msg.textContent = '❌ Incorrect password.';
    btn.disabled = false; btn.textContent = 'Upload Schedule';
  } else {
    msg.className = 'upload-msg error'; msg.textContent = "❌ Upload failed. Make sure it's a valid .xlsx file.";
    btn.disabled = false; btn.textContent = 'Upload Schedule';
  }
}

// ── Password modal ─────────────────────────────────────────────────────────────
function openPwModal(msg, callback) {
  pwCallback = callback;
  document.getElementById('pw-modal-msg').textContent = msg;
  document.getElementById('pw-modal-input').value = '';
  document.getElementById('pw-error').style.display = 'none';
  document.getElementById('pw-overlay').classList.add('visible');
  setTimeout(() => document.getElementById('pw-modal-input').focus(), 100);
}
function closePwModal(e) {
  if (e && e.target !== document.getElementById('pw-overlay')) return;
  document.getElementById('pw-overlay').classList.remove('visible');
  pwCallback = null;
}
async function submitPw() {
  if (!pwCallback) return;
  const pw = document.getElementById('pw-modal-input').value;
  const ok = await pwCallback(pw);
  if (!ok) {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-modal-input').value = '';
    document.getElementById('pw-modal-input').focus();
  }
}

loadTournaments();
maybeShowA2HS();

// ── Water polo ball 3D sphere spinner ──
(function(){
  const R=15, CX=18, CY=18;
  // 2 longitude seams (meridians) 90° apart + 2 latitude bands at ±30°
  const SEAMS=[
    {t:'v', a:0},
    {t:'v', a:Math.PI/2},
    {t:'h', b:0.52},
    {t:'h', b:-0.52},
  ];
  let phi=0;
  function pt(lat,lon){
    const a=lon-phi;
    return {x:CX+R*Math.cos(lat)*Math.sin(a), y:CY-R*Math.sin(lat), f:Math.cos(lat)*Math.cos(a)>=0};
  }
  function seamPath(s){
    const N=40, pts=[];
    if(s.t==='v') for(let i=0;i<=N;i++) pts.push(pt((i/N-0.5)*Math.PI, s.a));
    else          for(let i=0;i<=N;i++) pts.push(pt(s.b, i/N*2*Math.PI));
    let d='', on=false;
    for(const p of pts){
      if(p.f){ d+=(on?` L${p.x.toFixed(1)},${p.y.toFixed(1)}`:`M${p.x.toFixed(1)},${p.y.toFixed(1)}`); on=true; }
      else on=false;
    }
    return d;
  }
  function tick(){
    phi+=0.033;
    document.querySelectorAll('.wp-spinner .wp-seams').forEach(function(g){
      var ps=g.querySelectorAll('path');
      SEAMS.forEach(function(s,i){ if(ps[i]) ps[i].setAttribute('d',seamPath(s)); });
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
