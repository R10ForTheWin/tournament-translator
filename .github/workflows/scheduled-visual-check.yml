name: Scheduled visual/bracket health check

# Runs the real-browser checks (verify_bracket_rendering.py,
# visual_regression.py) 2x/day (morning + early afternoon), ONLY on days
# that fall within a known tournament's date range, and pushes an ntfy
# alert on failure -- the automated replacement for a human periodically
# opening the app on their phone and looking at it.
#
# Deliberately a SEPARATE scheduled job, not folded into the app's own
# in-process pre-game monitor (_run_pre_game_sweep in app.py): Playwright +
# a Chromium browser are real, heavy dependencies (~300MB+) intentionally
# kept OUT of requirements.txt / the production Railway build so the live
# app stays lightweight. GitHub Actions already has them installed for CI
# (see smoke.yml) -- reusing that here instead of adding browser automation
# to the production server process.
#
# Setup required once: `gh secret set NTFY_TOPIC` (or via repo Settings ->
# Secrets) with the same ntfy.sh topic app.py's _send_ntfy() already uses in
# production. Without that secret, this job still runs and reports failures
# in the Actions tab, it just can't push a phone notification.
#
# Cost note: this repo is PRIVATE, so GitHub Actions minutes are not free.
# The full check (install Playwright + a real Chromium browser, drive 7
# teams through real page loads) is genuinely not cheap -- easily 5-10
# minutes per run. Running it unconditionally around the clock, every day,
# forever would plausibly burn most of a free-tier monthly minutes
# allowance on this one workflow. The "gate" job below is the fix: it runs
# on the SAME 2x/day cron every day (cheap -- checkout + a lightweight pip
# install + a date check, no Playwright), but only triggers the expensive
# job on days that actually fall within a KNOWN_TOURNAMENTS date range.
# Trimmed from 3x/day to 2x/day 2026-07-23 (was costing real Actions
# minutes for marginal extra coverage once the checks themselves were
# proven reliable against a live tournament day).
#
# Times are UTC-fixed for PDT (UTC-7) -- correct for Junior Olympics
# (July) and any other spring/summer tournament. GitHub Actions cron has
# no timezone/DST awareness, so a tournament during PST (roughly
# Nov-early Mar) would fire these one hour later than intended in Pacific
# wall-clock terms (e.g. the "8am" run would actually land at 7am PST).
# None of this app's current tournaments fall in that window except
# possibly late Feb (futures-2) -- revisit if that ever matters in practice.

on:
  schedule:
    - cron: "0 15 * * *"   # 8:00 AM PDT
    - cron: "0 20 * * *"   # 1:00 PM PDT
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      is_tournament_day: ${{ steps.check.outputs.is_tournament_day }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Lightweight install only -- NOT requirements-dev.txt (no Playwright
      # needed just to check a date). Reads KNOWN_TOURNAMENTS directly from
      # app.py rather than duplicating tournament dates here, so there's
      # only ever one place these dates need to stay correct.
      - name: Install lightweight dependencies
        run: pip install -r requirements.txt

      - name: Check whether today (Pacific) is a tournament day
        id: check
        run: python3 scripts/ci_is_tournament_day.py

  visual-check:
    needs: gate
    if: needs.gate.outputs.is_tournament_day == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python3 -m playwright install --with-deps chromium

      - name: Bracket rendering checks (real browser)
        id: bracket_checks
        continue-on-error: true
        run: python3 tests/verify_bracket_rendering.py --port 5099

      - name: Visual regression (pixel diff vs static fixture)
        id: visual_checks
        continue-on-error: true
        run: python3 tests/visual_regression.py --port 5099

      - name: Notify on failure
        if: steps.bracket_checks.outcome == 'failure' || steps.visual_checks.outcome == 'failure'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set -- skipping push notification (failure is still visible in this Actions run)."
            exit 0
          fi
          BODY="bracket_checks=${{ steps.bracket_checks.outcome }} visual_checks=${{ steps.visual_checks.outcome }} -- see run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -H "Title: Scheduled bracket check FAILED" -H "Priority: high" -H "Tags: warning" \
            -d "$BODY" "https://ntfy.sh/$NTFY_TOPIC"

      - name: Fail the job if either check failed
        if: steps.bracket_checks.outcome == 'failure' || steps.visual_checks.outcome == 'failure'
        run: exit 1
